<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 950" role="img" aria-label="Architecture de déploiement Kubernetes">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .h   { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .t   { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 600; fill: #0f172a; }
      .s   { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #64748b; }
      .lab { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #475569; }
      .lg  { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #64748b; }
      .box { fill: #ffffff; stroke-width: 2.5; }
      .cfg { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 6 4; }
      .sec { fill: #f0f9ff; stroke: #0ea5e9; stroke-width: 2; stroke-dasharray: 6 4; }
      .ln  { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arr); }
      .ld  { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrDash); }
    </style>
  </defs>

  <rect width="1160" height="950" rx="18" fill="#f8fafc"/>
  <text x="40" y="52" class="h">Architecture de déploiement</text>

  <rect x="130" y="120" width="990" height="770" rx="16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="152" y="150" class="lab">Cluster Kubernetes</text>

  <rect x="445" y="20" width="220" height="70" rx="12" class="box" stroke="#64748b"/>
  <text x="555" y="49" text-anchor="middle" class="t">Navigateur</text>
  <text x="555" y="71" text-anchor="middle" class="s">client web (SPA)</text>

  <rect x="395" y="160" width="320" height="110" rx="12" class="box" stroke="#7c3aed"/>
  <text x="555" y="192" text-anchor="middle" class="t">Ingress nginx</text>
  <text x="555" y="216" text-anchor="middle" class="s">/  →  angular-service</text>
  <text x="555" y="236" text-anchor="middle" class="s">/api(/|$)(.*)  →  spring-service</text>
  <text x="555" y="256" text-anchor="middle" class="s">TLS : app-tls</text>

  <path d="M 555 90 L 555 158" class="ln"/>

  <path d="M 555 270 L 555 292 L 290 292 L 290 328" class="ln"/>
  <path d="M 555 270 L 555 292 L 830 292 L 830 328" class="ln"/>
  <text x="350" y="283" text-anchor="middle" class="lg">HTTP</text>
  <text x="690" y="283" text-anchor="middle" class="lg">REST /api</text>

  <rect x="180" y="330" width="220" height="64" rx="12" class="box" stroke="#DD0031"/>
  <text x="290" y="357" text-anchor="middle" class="t">angular-service</text>
  <text x="290" y="379" text-anchor="middle" class="s">ClusterIP :80</text>

  <rect x="180" y="430" width="220" height="88" rx="12" class="box" stroke="#DD0031"/>
  <text x="290" y="461" text-anchor="middle" class="t">Pod Angular</text>
  <text x="290" y="483" text-anchor="middle" class="s">nginx · SPA + config.js</text>
  <text x="290" y="502" text-anchor="middle" class="s">Angular 16</text>

  <path d="M 290 396 L 290 428" class="ln"/>

  <rect x="180" y="560" width="220" height="64" rx="12" class="cfg"/>
  <text x="290" y="586" text-anchor="middle" class="t" style="font-size:15px">ConfigMap angular-config</text>
  <text x="290" y="607" text-anchor="middle" class="s">API_URL = /api</text>

  <path d="M 290 558 L 290 520" class="ld"/>

  <rect x="720" y="330" width="220" height="64" rx="12" class="box" stroke="#6DB33F"/>
  <text x="830" y="357" text-anchor="middle" class="t">spring-service</text>
  <text x="830" y="379" text-anchor="middle" class="s">ClusterIP :8081</text>

  <rect x="720" y="430" width="220" height="88" rx="12" class="box" stroke="#6DB33F"/>
  <text x="830" y="461" text-anchor="middle" class="t">Pod Spring Boot</text>
  <text x="830" y="483" text-anchor="middle" class="s">Java 17 · /user/*</text>
  <text x="830" y="502" text-anchor="middle" class="s">Actuator · Prometheus</text>

  <path d="M 830 396 L 830 428" class="ln"/>

  <rect x="480" y="560" width="200" height="64" rx="12" class="cfg"/>
  <text x="580" y="586" text-anchor="middle" class="t" style="font-size:15px">ConfigMap app-config</text>
  <text x="580" y="607" text-anchor="middle" class="s">DB URL · CORS</text>

  <rect x="480" y="650" width="200" height="64" rx="12" class="sec"/>
  <text x="580" y="676" text-anchor="middle" class="t">Secret app-secret</text>
  <text x="580" y="697" text-anchor="middle" class="s">identifiants DB</text>

  <path d="M 682 592 L 718 480" class="ld"/>
  <path d="M 682 682 L 718 505" class="ld"/>

  <rect x="720" y="560" width="220" height="64" rx="12" class="box" stroke="#4479A1"/>
  <text x="830" y="587" text-anchor="middle" class="t">mysql-service</text>
  <text x="830" y="609" text-anchor="middle" class="s">ClusterIP :3306</text>

  <path d="M 830 520 L 830 558" class="ln"/>

  <rect x="720" y="660" width="220" height="84" rx="12" class="box" stroke="#4479A1"/>
  <text x="830" y="690" text-anchor="middle" class="t">Pod MySQL 8.0</text>
  <text x="830" y="712" text-anchor="middle" class="s">base « demo »</text>
  <text x="830" y="730" text-anchor="middle" class="s">volume : /var/lib/mysql</text>

  <path d="M 830 626 L 830 658" class="ln"/>

  <rect x="720" y="780" width="220" height="84" rx="12" class="box" stroke="#4479A1" stroke-dasharray="7 5"/>
  <text x="830" y="810" text-anchor="middle" class="t">PVC mysql-pvc</text>
  <text x="830" y="832" text-anchor="middle" class="s">PV hostPath 1Gi</text>
  <text x="830" y="850" text-anchor="middle" class="s">/mnt/data/mysql · nœud slave</text>

  <path d="M 830 746 L 830 778" class="ln"/>

  <line x1="40" y1="912" x2="90" y2="912" class="ln" style="marker-end:none"/>
  <text x="100" y="917" class="lg">flux applicatif</text>
  <line x1="220" y1="912" x2="270" y2="912" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="280" y="917" class="lg">configuration injectée (ConfigMap / Secret)</text>
</svg>
